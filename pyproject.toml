[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefling-acp-bridge"
version = "0.3.5"
description = "Connects an ACP agent (Kiro CLI, ...) to a briefling hub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]

[project.scripts]
briefling-acp = "briefling_acp.__main__:main"

[tool.setuptools]
packages = ["briefling_acp"]
